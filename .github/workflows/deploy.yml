name: Production Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_cdn_font_check:
        description: Force a full CDN font verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qians-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:media
      - name: Check production bucket
        run: test "$R2_BUCKET" = website
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - name: Sync R2 media and verify CDN font delivery
        run: pnpm run sync:media --verify-fonts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          FORCE_FULL_CDN_FONT_CHECK: ${{ inputs.full_cdn_font_check }}
      - run: pnpm run build
        env:
          MEDIA_BASE_URL: https://site-cdn.qians.day
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name=qians-day --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
