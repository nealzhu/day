name: PR Check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:media
      - run: pnpm run check
      - run: |
          set -o pipefail
          if pnpm test 2>&1 | tee "$RUNNER_TEMP/day-tests.log"; then
            exit 0
          fi
          awk '/^✖ failing tests:/ { report = 1 } report && (/^✖/ || /Error:|tests\/.*\.mjs:[0-9]+|^test at /) { print substr($0, 1, 200) }' "$RUNNER_TEMP/day-tests.log" | head -20 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//%/%25}"
          done
          exit 1
      - run: pnpm run build
